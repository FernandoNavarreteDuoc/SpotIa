server:
  port: 0

spring:
  application:
    name: ubicaciones
  profiles:
    active: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /ubicaciones/api-docs
  packages-to-scan: com.ubicacion.ubicaciones.controller
  use-management-port: false
  override-with-generic-response: true
  servers:
    - url: http://localhost:8080
      description: Gateway SpotIa

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_ubicaciones_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_ubicaciones_test?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_ubicaciones_prod?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none