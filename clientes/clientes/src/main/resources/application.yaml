server:
  port: 0
  forward-headers-strategy: framework

spring:
  application:
    name: clientes
  flyway:
    enabled: 'true'
    baseline-on-migrate: 'true'
  jpa:
    show-sql: 'true'
  profiles:
    active: dev
  mvc:
    cors:
      mappings:
        "/**":
          allowed-origin-patterns: "*"
          allowed-methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
          allowed-headers: "*"
          exposed-headers: "*"
          allow-credentials: false
          max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

springdoc:
  api-docs:
    path: /clientes/api-docs
  packages-to-scan: com.cliente.clientes.controller
  use-management-port: false

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://${DATABASE_HOST:localhost}:3306/db_spotia_clientes_dev?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_clientes_test?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_clientes_prod?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none