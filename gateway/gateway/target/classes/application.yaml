server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: reserva-service
              uri: lb://reservas
              predicates:
                - Path=/api/v1/reservas/**
            - id: cliente-service
              uri: lb://clientes
              predicates:
                - Path=/api/v1/clientes/**
            - id: local-service
              uri: lb://locales
              predicates:
                - Path=/api/v1/locales/**
            - id: ubicacion-service
              uri: lb://ubicaciones
              predicates:
                - Path=/api/v1/ubicaciones/**