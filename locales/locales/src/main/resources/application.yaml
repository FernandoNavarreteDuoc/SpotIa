server:
  port: 0

spring:
  application:
    name: locales
  profiles:
    active: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /locales/api-docs
  packages-to-scan: com.local.locales.controller
  use-management-port: false
  override-with-generic-response: true

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_locales_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_locales_test?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: root
    password: ''
    url: jdbc:mysql://localhost:3306/db_spotia_locales_prod?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none