eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
server:
    port: 0
spring:
    application:
        name: reservas
    config:
        activate:
            on-profile: dev
    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        password: ''
        url: jdbc:mysql://localhost:3306/db_spotia_reservas_dev?createDatabaseIfNotExist=true
        username: root
    flyway:
        baseline-on-migrate: true
        enabled: true
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    profiles:
        active: dev
springdoc:
    api-docs:
        enabled: true
        path: /reservas/api-docs
    swagger-ui:
        enabled: true
        path: /doc/swagger-ui.html

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_spotia_reservas_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: update

